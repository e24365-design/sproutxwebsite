name: Sproutx SMS alerts

on:
  schedule:
    - cron: "30 0 * * *"      # every day 06:00 Sri Lanka time (00:30 UTC)
  workflow_dispatch:           # also lets you press "Run workflow" by hand in GitHub

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check weather and send SMS
        run: python sms_alerts.py --send
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
